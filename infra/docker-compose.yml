services:
  db:
    image: postgis/postgis:16-3.4
    container_name: medilink-db
    environment:
      POSTGRES_DB: medilink
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink
    # 55432 on the HOST, 5432 inside. The API is unaffected either way - it
    # reaches this over the compose network as `db:5432`, and the published
    # port exists only for tools running natively on the machine.
    #
    # It used to publish 5432, which looks right and quietly is not: a
    # developer machine with PostgreSQL installed natively already has a
    # postgres.exe listening there, and that service wins the port. Docker
    # still reports 5432 as published, so `localhost:5432` appears correct
    # while actually reaching the wrong database entirely - the failure is
    # `password authentication failed`, which reads like a bad credential
    # rather than a bad server. Same class of conflict as the Redis note
    # below, and the same fix: do not fight for a port somebody else holds.
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medilink -d medilink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medilink-redis
    # 56379 on the HOST, 6379 inside. The API does not use this - it reaches
    # Redis over the compose network on 6379 - but anything running natively
    # against this stack does, and without a published port every cached or
    # throttled endpoint fails.
    #
    # This used to publish nothing, on the reasoning that nothing on the host
    # needed Redis. That stopped being true the moment the backend could be
    # run natively. The original conflict was real, though, and the lesson
    # from it holds: 6379 and 6380 are both already taken on a machine with
    # other projects on it, so this claims a port high enough that nothing
    # else is likely to want it, rather than competing for the obvious one.
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    # The API belongs HERE, not in a hand-typed `docker run`. It used to be
    # assembled by hand, which meant it vanished on every Docker restart and
    # had to be rebuilt from memory - including the network name and the two
    # service hostnames. `docker compose up` now brings up all three.
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medilink-api
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    volumes:
      # Bind-mounted so the reloader picks up edits without a rebuild.
      - ../backend:/app
    environment:
      # `db` and `redis`, not localhost: inside the compose network these are
      # the service names. Redis is on 6379 internally - the 6380 in the
      # published port exists because another local project holds 6379 on the
      # host, and that mapping does not apply between containers.
      DATABASE_URL: postgis://medilink:medilink@db:5432/medilink
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Blanked deliberately, for the same reason the two URLs above are set
      # here: `env_file` below pulls in backend/.env, which on a Windows
      # machine carries native GDAL/GEOS paths so the backend can be run
      # outside Docker. Inherited in here, they point ctypes at a `C:\` path
      # that does not exist in a Linux container, and the API dies on import
      # with `cannot open shared object file`. This image gets GDAL from apt
      # under a soname Django already probes for, so empty is correct and
      # means "search the usual places".
      GDAL_LIBRARY_PATH: ""
      GEOS_LIBRARY_PATH: ""
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
