# TLS termination and static serving.
#
# Certificates are expected in ./certs. Use certbot or your host's manager;
# this file assumes fullchain.pem and privkey.pem.

upstream medilink_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    # ACME challenges must survive the redirect, or renewal fails silently
    # and the site goes dark in 90 days.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Django also sets these; nginx repeats them so a misconfigured app
    # cannot drop them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Patients are on 3G. Compression is not optional here.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://medilink_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The USSD IP allowlist reads this. Without it every webhook appears
        # to come from the nginx container and the allowlist rejects them all.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        # Ops-only. Restrict to the office range before this holds real data;
        # docs/08 section 5 requires an allowlist plus MFA.
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://medilink_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # The service worker must never be cached, or a released fix cannot reach a
    # phone that already installed the app.
    location = /sw.js {
        root /var/www/html;
        add_header Cache-Control "no-cache";
    }

    # One app, one root. /workspace and /platform are client-side routes behind
    # a session check, not separate builds - so everything falls through to the
    # same index.html and the router decides what the caller sees.
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}
