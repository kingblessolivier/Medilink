        display_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        initials:
          type: string
          readOnly: true
        photo_url:
          type: string
          readOnly: true
        languages:
          type: array
          items:
            type: string
          readOnly: true
        specialties:
          type: array
          items:
