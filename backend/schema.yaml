      - status
    StaffAppointmentList:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/StaffAppointment'
      required:
      - count
      - date
      - results
    StaffFacility:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        district:
          type: string
        reports_queue:
          type: boolean
      required:
      - district
      - id
      - name
      - reports_queue
      - slug
    StaffMe:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
        can_manage_queue:
          type: boolean
        facility:
          $ref: '#/components/schemas/StaffFacility'
        services:
          type: array
          items:
            $ref: '#/components/schemas/StaffService'
      required:
      - can_manage_queue
      - facility
      - role
      - services
      - username
    StaffService:
      type: object
      properties:
        code:
          type: string
        name_rw:
          type: string
        name_en:
          type: string
      required:
      - code
      - name_en
      - name_rw
    StaffServiceCoverage:
      type: object
      properties:
        code:
          type: string
        name_en:
          type: string
        coverage:
          $ref: '#/components/schemas/CoverageEnum'
        note:
          type: string
      required:
      - code
      - coverage
      - name_en
      - note
    StartSession:
      type: object
      description: |-
        Optional free text describing how the patient feels.

        Capped hard. This is matched against a phrase list and then discarded, so
        there is no reason to accept an essay - and an unbounded field that is
        normalised character by character is a cheap way to burn CPU on a public
        endpoint.
      properties:
        symptom_text:
          type: string
          maxLength: 300
    Sync:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SyncAction'
      required:
      - actions
    SyncAction:
      type: object
      properties:
        key:
          type: string
          maxLength: 64
        type:
          $ref: '#/components/schemas/TypeEnum'
        client_recorded_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: {}
      required:
      - client_recorded_at
      - key
      - type
    SyncResponse:
      type: object
      properties:
        applied:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncResultRow'
      required:
      - applied
      - rejected
      - results
    SyncResultRow:
      type: object
      properties:
        key:
          type: string
        ok:
          type: boolean
        created:
          type: boolean
        entry_id:
          type: integer
        ticket_code:
          type: string
        error:
          type: string
      required:
      - key
      - ok
    TeamMember:
      type: object
      description: |-
        One colleague at this facility.

        No email, no password, no last-login IP. This list answers "who can get
        in, and as what" - anything beyond that is a second question, and staff
        records are personal data too.
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        role:
          type: string
        role_label:
          type: string
        active:
          type: boolean
        is_self:
          type: boolean
      required:
      - active
      - full_name
      - id
      - is_self
      - role
      - role_label
      - username
    TeamMemberCreated:
      type: object
      description: |-
        The create response, which carries the temporary password ONCE.

        It is generated rather than chosen: an administrator inventing passwords
        for their colleagues picks the clinic name and a digit. It is returned in
        this response and never stored in readable form or shown again - the
        workspace tells the administrator to hand it over and have it changed.
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        role:
          type: string
        role_label:
          type: string
        active:
          type: boolean
        is_self:
          type: boolean
        temporary_password:
          type: string
      required:
      - active
      - full_name
      - id
      - is_self
      - role
      - role_label
      - temporary_password
      - username
    TeamMemberWrite:
      type: object
      description: |-
        Create one staff account at the caller's own facility.

        `facility` is deliberately absent. It comes from the caller's own
        StaffMember and can never be supplied, so an administrator cannot create
        an account somewhere else by editing the payload.
      properties:
        username:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{2,29}$
        full_name:
          type: string
          default: ''
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - username
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        patient:
          $ref: '#/components/schemas/Patient'
      required:
      - access
      - patient
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Translation:
      type: object
      properties:
        rw:
          type: string
        en:
          type: string
        fr:
          type: string
      required:
      - en
      - fr
      - rw
    TriageMonitoring:
      type: object
      properties:
        days:
          type: integer
        sessions:
          type: integer
        escalations:
          type: integer
        escalation_rate:
          type: number
          format: double
          nullable: true
        enough_data:
          type: boolean
        minimum_sessions:
          type: integer
        by_service:
          type: array
          items:
            $ref: '#/components/schemas/TriageServiceCount'
        by_version:
          type: array
          items:
            $ref: '#/components/schemas/TriageVersion'
      required:
      - by_service
      - by_version
      - days
      - enough_data
      - escalation_rate
      - escalations
      - minimum_sessions
      - sessions
    TriageOption:
      type: object
      properties:
        code:
          type: string
        text:
          $ref: '#/components/schemas/Translation'
      required:
      - code
      - text
    TriageQuestion:
      type: object
      properties:
        code:
          type: string
        red_flag:
          type: boolean
        text:
          $ref: '#/components/schemas/Translation'
        options:
          type: array
          items:
            $ref: '#/components/schemas/TriageOption'
      required:
      - code
      - options
      - red_flag
      - text
    TriageServiceCount:
      type: object
      properties:
        service:
          type: string
        count:
          type: integer
      required:
      - count
      - service
    TriageSession:
      type: object
      properties:
        session_id:
          type: string
        protocol_version:
          type: string
        approved_by:
          type: string
        disclaimer:
          $ref: '#/components/schemas/Translation'
        escalate_emergency:
          type: boolean
        emergency_advice:
          allOf:
          - $ref: '#/components/schemas/Translation'
          nullable: true
        recommendation:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RankedCondition'
        finished:
          type: boolean
        next_question:
          allOf:
          - $ref: '#/components/schemas/TriageQuestion'
          nullable: true
      required:
      - approved_by
      - conditions
      - disclaimer
      - emergency_advice
      - escalate_emergency
      - finished
      - next_question
      - protocol_version
      - recommendation
      - session_id
    TriageStatus:
      type: object
      properties:
        available:
          type: boolean
        protocol_version:
          type: string
        approved_by:
          type: string
        approved_on:
          type: string
        reason:
          type: string
      required:
      - approved_by
      - approved_on
      - available
      - protocol_version
      - reason
    TriageVersion:
      type: object
      properties:
        protocol_version:
          type: string
        sessions:
          type: integer
        escalations:
          type: integer
      required:
      - escalations
      - protocol_version
      - sessions
    TypeEnum:
      enum:
      - check_in
      - call
      - serve
      - skip
      - cancel
      type: string
      description: |-
        * `check_in` - check_in
        * `call` - call
        * `serve` - serve
        * `skip` - skip
        * `cancel` - cancel
    VerificationQueue:
      type: object
      properties:
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/PendingFacility'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/PendingProvider'
      required:
      - facilities
      - providers
    Verified:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        verified_at:
          type: string
          format: date-time
        verified_by:
          type: string
          nullable: true
      required:
      - id
      - name
      - verified_at
      - verified_by
    Verify:
      type: object
      description: |-
        Verifying is an assertion that somebody checked documents.

        The note is required for exactly that reason: an approval with no record
        of what was checked is indistinguishable from a mis-click, and this one
        puts a facility in front of patients.
      properties:
        note:
          type: string
          maxLength: 500
      required:
      - note
    Wait:
      type: object
      description: |-
        The wait contract, enforced in the OpenAPI schema itself.

        `status` is a ChoiceField rather than a CharField so the generated
        TypeScript client gets a closed union and a client that forgets to
        handle one of the four states fails to compile. There is deliberately
        no value meaning "estimated" - we never guess a wait time.

        Defined above ServiceBriefSerializer because that one embeds it.
      properties:
        status:
          $ref: '#/components/schemas/WaitStatusEnum'
        minutes:
          type: integer
          nullable: true
        people_waiting:
          type: integer
          nullable: true
        as_of:
          type: string
      required:
      - as_of
      - minutes
      - people_waiting
      - status
    WaitStatusEnum:
      enum:
      - available
      - not_reported
      - insufficient_data
      - closed
      type: string
      description: |-
        * `available` - available
        * `not_reported` - not_reported
        * `insufficient_data` - insufficient_data
        * `closed` - closed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patientJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Patient token from POST /auth/otp/verify. Structurally separate
        from staff tokens: it can never satisfy a staff permission.'
