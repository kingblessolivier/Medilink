      type: string
      description: |-
        * `check_in` - check_in
        * `call` - call
        * `serve` - serve
        * `skip` - skip
        * `cancel` - cancel
    VerificationQueue:
      type: object
      properties:
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/PendingFacility'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/PendingProvider'
      required:
