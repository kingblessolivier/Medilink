    TypeEnum:
      enum:
      - check_in
      - call
      - serve
      - skip
      - cancel
      type: string
      description: |-
        * `check_in` - check_in
        * `call` - call
        * `serve` - serve
        * `skip` - skip
        * `cancel` - cancel
    Wait:
      type: object
      description: |-
        The wait contract, enforced in the OpenAPI schema itself.

        `status` is a ChoiceField rather than a CharField so the generated
        TypeScript client gets a closed union and a client that forgets to
        handle one of the four states fails to compile. There is deliberately
        no value meaning "estimated" - we never guess a wait time.
      properties:
        status:
          $ref: '#/components/schemas/WaitStatusEnum'
        minutes:
          type: integer
          nullable: true
        people_waiting:
          type: integer
          nullable: true
        as_of:
          type: string
      required:
      - as_of
      - minutes
      - people_waiting
      - status
    WaitStatusEnum:
      enum:
      - available
      - not_reported
      - insufficient_data
      - closed
      type: string
      description: |-
        * `available` - available
        * `not_reported` - not_reported
        * `insufficient_data` - insufficient_data
        * `closed` - closed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patientJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Patient token from POST /auth/otp/verify. Structurally separate
        from staff tokens: it can never satisfy a staff permission.'
