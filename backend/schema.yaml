openapi: 3.0.3
info:
  title: MediLink Rwanda API
  version: 0.2.0
  description: Nearby facilities, insurance acceptance, and live queues.
paths:
  /api/v1/appointments:
    get:
      operationId: appointments_list
      summary: The signed-in patient's appointments
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: upcoming | past | all
      tags:
      - appointments
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/cancel:
    post:
      operationId: appointments_cancel_create
      summary: Cancel an appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/create:
    post:
      operationId: appointments_create_create
      summary: Book an appointment
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Booking'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: Always returns 204, whether or not the number is known - the response
        must not reveal which numbers are registered.
      summary: Request a sign-in code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequest'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      summary: Exchange a sign-in code for tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerify'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/districts:
    get:
      operationId: districts_retrieve
      description: |-
        Drives the fallback picker when geolocation is denied or out of bounds,
        and the first USSD menu in Phase 3.
      summary: Districts with verified facilities
      tags:
      - districts
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictList'
          description: ''
  /api/v1/facilities/{slug}:
    get:
      operationId: facilities_retrieve
      summary: Facility detail
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetail'
          description: ''
  /api/v1/facilities/{slug}/slots:
    get:
      operationId: facilities_slots_retrieve
      summary: Bookable slots for a facility and service
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: service
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDays'
          description: ''
  /api/v1/facilities/nearby:
    get:
      operationId: facilities_nearby_retrieve
      description: Verified facilities near a coordinate, ranked by (tier, distance).
        Results are never ranked by wait time - only a minority of facilities report
        queue data, so ranking on it would bury good facilities that simply do not
        report.
      summary: Nearby facilities
      parameters:
      - in: query
        name: insurer
        schema:
          type: string
        description: Insurer code, e.g. mutuelle
      - in: query
        name: lat
        schema:
          type: number
          format: double
        required: true
      - in: query
        name: level
        schema:
          type: array
          items:
            type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: lng
        schema:
          type: number
          format: double
        required: true
      - in: query
        name: open_now
        schema:
          type: boolean
      - in: query
        name: radius
        schema:
          type: integer
        description: Metres. Default 5000, max 50000.
      - in: query
        name: service
        schema:
          type: string
        description: Service type code
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResponse'
          description: ''
  /api/v1/insurers:
    get:
      operationId: insurers_retrieve
      description: Reference list. Changes perhaps twice a year - cache for 24h client-side.
      summary: Insurers
      tags:
      - insurers
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurerList'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      summary: The signed-in patient
      tags:
      - me
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
    patch:
      operationId: me_partial_update
      summary: Update the signed-in patient
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
  /api/v1/queue/board:
    get:
      operationId: queue_board_retrieve
      description: Everything the reception screen needs, grouped by service.
      summary: Queue board for the caller's facility
      tags:
      - queue
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/v1/queue/current:
    get:
      operationId: queue_current_retrieve
      description: |-
        What the patient home screen calls on load to choose between
        state A (nothing active) and state B (in a queue).

        204 when there is nothing active - an empty body, not an error.
      summary: The signed-in patient's active queue entry
      tags:
      - queue
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryPublic'
          description: ''
  /api/v1/queue/entries:
    post:
      operationId: queue_entries_create
      description: 'The most performance-sensitive write in the system. Send an Idempotency-Key
        header: a retry after a network timeout must return the original entry, not
        create a duplicate.'
      summary: Check a patient in
      tags:
      - queue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: ''
  /api/v1/queue/entries/{id}:
    get:
      operationId: queue_entries_retrieve
      description: |-
        Polled by the patient every 20 seconds.

        Scoped to the caller: a patient sees only their own entry, and facility
        staff see only entries at their own facility. Without this, an enumerated
        id reveals a stranger's position in a health queue.
      summary: One queue entry (patient-facing view)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - queue
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryPublic'
          description: ''
  /api/v1/queue/entries/{id}/{action}:
    post:
      operationId: queue_entry_transition
      summary: 'Move a queue entry: call, serve, skip or cancel'
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - queue
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntry'
          description: ''
  /api/v1/queue/sync:
    post:
      operationId: queue_sync_create
      description: |-
        Apply queued offline actions, oldest client timestamp first.

        Per-item results, so one rejected action does not fail the whole batch -
        a receptionist reconnecting after an hour must not lose the other 39
        check-ins because one patient was a duplicate.
      summary: Replay actions recorded while the reception client was offline
      tags:
      - queue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sync'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Sync'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Sync'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
  /api/v1/service-types:
    get:
      operationId: service_types_retrieve
      description: |-
        Small, cacheable reference list. Includes all three language names so
        that USSD and WhatsApp can render without a second call.
      summary: Service types
      tags:
      - service-types
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeList'
          description: ''
  /api/v1/staff/me:
    get:
      operationId: staff_me_retrieve
      description: |-
        The reception client calls this on load to learn which facility it is
        operating, and which services that facility offers.
      summary: The signed-in staff member and their facility
      tags:
      - staff
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        facility:
          allOf:
          - $ref: '#/components/schemas/AppointmentFacility'
          readOnly: true
        service:
          type: string
          readOnly: true
        slot_start:
          type: string
          format: date-time
          readOnly: true
        slot_end:
          type: string
          format: date-time
          readOnly: true
      required:
      - facility
      - id
      - reference
      - service
      - slot_end
      - slot_start
      - status
    AppointmentFacility:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        phone:
          type: string
      required:
      - name
      - phone
      - slug
    AppointmentStatusEnum:
      enum:
      - booked
      - arrived
      - served
      - no_show
      - cancelled
      type: string
      description: |-
        * `booked` - Booked
        * `arrived` - Arrived
        * `served` - Served
        * `no_show` - No show
        * `cancelled` - Cancelled
    Board:
      type: object
      properties:
        facility:
          $ref: '#/components/schemas/BoardFacility'
        as_of:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceGroup'
      required:
      - as_of
      - facility
      - services
    BoardFacility:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required:
      - name
      - slug
    Booking:
      type: object
      properties:
        facility:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        service:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        slot_start:
          type: string
          format: date-time
      required:
      - facility
      - service
      - slot_start
    CheckIn:
      type: object
      description: |-
        Minimal on purpose.

        Target is under 10 seconds of human time per check-in, so the payload is a
        service plus one identifier. `facility` is never accepted from the client -
        it is derived from the authenticated staff member, so a receptionist cannot
        check a patient into another facility.
      properties:
        service:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        phone:
          type: string
        walk_in_name:
          type: string
          maxLength: 150
        client_recorded_at:
          type: string
          format: date-time
      required:
      - service
    CheckInResponse:
      type: object
      description: The check-in response is an entry plus its live ETA fields.
      properties:
        id:
          type: integer
          readOnly: true
        ticket_code:
          type: string
          readOnly: true
        display_name:
          type: string
          description: |-
            Masked too.

            The model's display_name property falls back to the raw phone when a
            patient has no name on file. Masking `phone` while echoing the same
            number in `display_name` would defeat the point, so the fallback is
            masked here as well.
          readOnly: true
        phone:
          type: string
          description: |-
            Masked. A queue board is readable across a reception desk, and a
            full phone number on screen is a needless disclosure.
          readOnly: true
        service:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/QueueEntryStatusEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        called_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        waited_minutes:
          type: integer
          readOnly: true
        eta_minutes:
          type: integer
          nullable: true
        eta_confidence:
          type: string
          nullable: true
        people_ahead:
          type: integer
      required:
      - called_at
      - display_name
      - eta_confidence
      - eta_minutes
      - id
      - joined_at
      - people_ahead
      - phone
      - position
      - service
      - status
      - ticket_code
      - waited_minutes
    DistrictList:
      type: object
      properties:
        results:
          type: array
          items:
            type: string
      required:
      - results
    FacilityDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 200
        level:
          $ref: '#/components/schemas/LevelEnum'
        ownership:
          $ref: '#/components/schemas/OwnershipEnum'
        province:
          type: string
          maxLength: 50
        district:
          type: string
          maxLength: 50
        sector:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 255
        location:
          allOf:
          - $ref: '#/components/schemas/LocationField'
          readOnly: true
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        is_open:
          type: boolean
          readOnly: true
        opening_hours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
          readOnly: true
        insurers:
          type: array
          items:
            $ref: '#/components/schemas/InsurerBrief'
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceBrief'
          readOnly: true
        wait:
          allOf:
          - $ref: '#/components/schemas/Wait'
          readOnly: true
        directions_url:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          nullable: true
      required:
      - directions_url
      - district
      - id
      - insurers
      - is_open
      - level
      - location
      - name
      - opening_hours
      - ownership
      - services
      - slug
      - wait
    FacilityNearby:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 200
        level:
          $ref: '#/components/schemas/LevelEnum'
        ownership:
          $ref: '#/components/schemas/OwnershipEnum'
        district:
          type: string
          maxLength: 50
        sector:
          type: string
          maxLength: 50
        location:
          allOf:
          - $ref: '#/components/schemas/LocationField'
          readOnly: true
        distance_m:
          type: integer
          readOnly: true
        phone:
          type: string
          maxLength: 20
        is_open:
          type: boolean
          readOnly: true
        opens_at:
          type: string
          nullable: true
          readOnly: true
        closes_at:
          type: string
          nullable: true
          readOnly: true
        closing_soon:
          type: boolean
          description: A patient must not travel to a door that shuts on arrival.
          readOnly: true
        accepts_insurer:
          type: boolean
          readOnly: true
        insurers:
          type: array
          items:
            type: string
          readOnly: true
        services:
          type: array
          items:
            type: string
          readOnly: true
        wait:
          allOf:
          - $ref: '#/components/schemas/Wait'
          readOnly: true
        bookable:
          type: boolean
          readOnly: true
      required:
      - accepts_insurer
      - bookable
      - closes_at
      - closing_soon
      - distance_m
      - district
      - id
      - insurers
      - is_open
      - level
      - location
      - name
      - opens_at
      - ownership
      - services
      - slug
      - wait
    Insurer:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        is_public:
          type: boolean
      required:
      - code
      - is_public
      - name
    InsurerBrief:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        note:
          type: string
      required:
      - code
      - name
      - note
    InsurerList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Insurer'
      required:
      - results
    LanguageEnum:
      enum:
      - rw
      - en
      - fr
      type: string
      description: |-
        * `rw` - Kinyarwanda
        * `en` - English
        * `fr` - Francais
    LevelEnum:
      enum:
      - health_post
      - health_centre
      - district_hospital
      - referral_hospital
      - clinic
      - pharmacy
      type: string
      description: |-
        * `health_post` - Health post
        * `health_centre` - Health centre
        * `district_hospital` - District hospital
        * `referral_hospital` - Referral hospital
        * `clinic` - Clinic / polyclinic
        * `pharmacy` - Pharmacy
    LocationField:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required:
      - lat
      - lng
    NearbyQueryEcho:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        radius:
          type: integer
        radius_expanded:
          type: boolean
        insurer:
          type: string
          nullable: true
        service:
          type: string
          nullable: true
        open_now:
          type: boolean
