        always had this. It is scoped to their own facility and written to the
        audit log - see apps/patients/models.PatientAccessLog.
      properties:
        id:
          type: integer
        reference:
          type: string
        slot_start:
          type: string
          format: date-time
        slot_end:
          type: string
          format: date-time
        status:
          type: string
        booked_via:
          type: string
        service:
          type: string
        service_code:
          type: string
        provider:
          type: string
          nullable: true
        patient_name:
          type: string
        patient_phone:
          type: string
          nullable: true
      required:
      - booked_via
      - id
      - patient_name
      - patient_phone
      - provider
      - reference
      - service
      - service_code
      - slot_end
      - slot_start
      - status
