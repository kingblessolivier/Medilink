components:
  schemas:
    AccessActor:
      type: object
      properties:
        actor:
          type: string
        facility:
          type: string
        events:
          type: integer
      required:
      - actor
      - events
      - facility
    AccessEvent:
      type: object
      description: |-
        The patient is deliberately absent. Who did the touching, how much and
        when is what an access review needs; naming the patient would make the
        oversight tool its own disclosure risk.
      properties:
        id:
          type: integer
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        action_label:
          type: string
        facility:
          type: string
        record_count:
          type: integer
        ip_address:
          type: string
          nullable: true
      required:
      - action
      - action_label
      - actor
      - facility
      - id
      - ip_address
