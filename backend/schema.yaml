          items:
            type: string
          readOnly: true
        specialties:
          type: array
          items:
            type: string
          readOnly: true
        placements:
          type: array
          items:
            $ref: '#/components/schemas/Placement'
          readOnly: true
        verified:
          type: boolean
          readOnly: true
        bio_en:
          type: string
          description: Short professional summary. Never enter qualifications or claims
            that have not been verified - see docs/11 section 7.
      required:
      - display_name
      - full_name
      - initials
      - languages
      - photo_url
      - placements
      - slug
      - specialties
      - verified
    ProviderList:
      type: object
