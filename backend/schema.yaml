        kind_label:
          type: string
          readOnly: true
        channel:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        sent_at:
          type: string
          format: date-time
