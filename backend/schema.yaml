openapi: 3.0.3
info:
  title: MediLink Rwanda API
  version: 0.2.0
  description: Nearby facilities, insurance acceptance, and live queues.
paths:
  /api/v1/appointments:
    get:
      operationId: appointments_list
      description: |-
        One path, dispatched on method - the conventional shape, and the one
        docs/03 specifies.
      summary: List your appointments
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: upcoming | past | all
      tags:
      - appointments
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: ''
    post:
      operationId: appointments_create
      description: |-
        One path, dispatched on method - the conventional shape, and the one
        docs/03 specifies.
      summary: Book an appointment
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Booking'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}:
    get:
      operationId: appointment_detail
      description: |-
        Scoped to the caller: an enumerated id must not reveal somebody else's
        appointment.
      summary: One appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/cancel:
    post:
      operationId: appointments_cancel_create
      summary: Cancel an appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: One endpoint for patients, facility staff and platform admins.
        The response says which kind the caller is; the client routes on that. A patient
        may use either their username or their phone number.
      summary: Sign in with a username and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
          description: ''
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: Always returns 204, whether or not the number is known - the response
        must not reveal which numbers are registered.
      summary: Request a sign-in code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequest'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      summary: Exchange a sign-in code for tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerify'
        required: true
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: |-
        Creates a patient account, or attaches web credentials to a phone number that has only ever used USSD. Staff and admin accounts are created by MediLink, never self-served.

        Requires a one-time code from POST /auth/otp/request. Registration writes to whatever record already holds that number, so the number must be proved first - otherwise anyone knowing it could claim that patient's history. Returns 401 if the code is wrong or expired.
      summary: Register as a patient
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
          description: ''
  /api/v1/auth/session:
    get:
      operationId: auth_session_retrieve
      description: The client calls this on load to decide which surface to show.
        It accepts either principal - a staff/admin JWT or a patient JWT.
      summary: The signed-in caller and what kind of thing they are
      tags:
      - auth
      security:
      - patientJWT: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/districts:
    get:
      operationId: districts_retrieve
      description: |-
        Drives the fallback picker when geolocation is denied or out of bounds,
        and the first USSD menu in Phase 3.
      summary: Districts with verified facilities
      tags:
      - districts
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictList'
          description: ''
  /api/v1/facilities/{slug}:
    get:
      operationId: facilities_retrieve
      summary: Facility detail
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetail'
          description: ''
  /api/v1/facilities/{slug}/providers:
    get:
      operationId: facility_providers
      summary: Doctors practising at a facility
      parameters:
      - in: query
        name: service
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: specialty
        schema:
          type: string
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
          description: ''
  /api/v1/facilities/{slug}/slots:
    get:
      operationId: facilities_slots_retrieve
      summary: Bookable slots for a facility and service
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: provider
        schema:
          type: string
        description: Provider slug. Omit for the facility general clinic - 'any available',
          which is the default and the common case.
      - in: query
        name: service
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDays'
          description: ''
  /api/v1/facilities/nearby:
    get:
      operationId: facilities_nearby_retrieve
      description: Verified facilities near a coordinate, ranked by (tier, distance).
        Results are never ranked by wait time - only a minority of facilities report
        queue data, so ranking on it would bury good facilities that simply do not
        report.
      summary: Nearby facilities
      parameters:
      - in: query
        name: district
        schema:
          type: string
        description: The fallback when a browser gives no location. Returns that district's
          facilities with distance_m null - there is no origin to measure from.
      - in: query
        name: insurer
        schema:
          type: string
        description: Insurer code, e.g. mutuelle
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: With lng. Or give district.
      - in: query
        name: level
        schema:
          type: array
          items:
            type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: lng
        schema:
          type: number
          format: double
        description: With lat. Or give district.
      - in: query
        name: open_now
        schema:
          type: boolean
      - in: query
        name: radius
        schema:
          type: integer
        description: Metres. Default 5000, max 50000.
      - in: query
        name: service
        schema:
          type: string
        description: Service type code
      - in: query
        name: specialty
        schema:
          type: string
        description: Specialty code, from a Care Guide recommendation
      tags:
      - facilities
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResponse'
          description: ''
  /api/v1/insurers:
    get:
      operationId: insurers_retrieve
      description: Reference list. Changes perhaps twice a year - cache for 24h client-side.
      summary: Insurers
      tags:
      - insurers
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurerList'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      summary: The signed-in patient
      tags:
      - me
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
    patch:
      operationId: me_partial_update
      summary: Update the signed-in patient
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPatient'
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          description: ''
    delete:
      operationId: me_destroy
      description: 'The right of erasure. Records are anonymised rather than deleted:
        the facility keeps its attendance counts, which every other patient''s wait
        estimate depends on, and you are no longer identifiable in them. This cannot
        be undone.'
      summary: Erase your account
      tags:
      - me
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/export:
    get:
      operationId: me_export_retrieve
      description: The right of access under Rwanda Law 058/2021. Returns the profile,
        appointment and queue history, and every message sent - in one document. Symptom-checker
        answers are not included because they are never stored against an account.
      summary: Export everything held about you
      tags:
      - me
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/me/notification-preferences:
    get:
      operationId: notification_preferences
      summary: Which messages you receive
      tags:
      - me
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceList'
          description: ''
    patch:
      operationId: notification_preferences_update
      summary: Turn one kind of message on or off
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPreferenceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPreferenceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPreferenceUpdate'
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceList'
          description: ''
  /api/v1/me/notifications:
    get:
      operationId: notification_list
      summary: Messages MediLink has sent you
      tags:
      - me
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
          description: ''
  /api/v1/platform/access-log:
    get:
      operationId: platform_access_log_retrieve
      description: The audit trail from docs/08 section 6. The PATIENT is never named
        - who did the touching, how much and when is what an access review needs,
        and naming the patient would make the oversight tool its own disclosure risk.
      summary: Who looked at whose record
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1-90. Defaults to 7.
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLog'
          description: ''
  /api/v1/platform/activity:
    get:
      operationId: platform_activity_retrieve
      summary: Operational state across every facility
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1-90. Defaults to 7.
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformActivity'
          description: ''
  /api/v1/platform/delivery:
    get:
      operationId: platform_delivery_retrieve
      description: A 'leave now' SMS that never sent is a patient still sitting at
        home. Message bodies are never returned - several carry a queue position and
        one carries a sign-in code.
      summary: Did the messages arrive?
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1-90. Defaults to 7.
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryReport'
          description: ''
  /api/v1/platform/facilities:
    get:
      operationId: platform_facilities_retrieve
      summary: Every facility, with what an admin can act on
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFacilityList'
          description: ''
  /api/v1/platform/insurers:
    get:
      operationId: platform_insurers_retrieve
      summary: Every insurer on the platform
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInsurerList'
          description: ''
  /api/v1/platform/insurers/{code}:
    patch:
      operationId: platform_insurers_partial_update
      summary: Rename or reorder an insurer
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminInsurerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminInsurerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminInsurerWrite'
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInsurer'
          description: ''
  /api/v1/platform/insurers/new:
    post:
      operationId: platform_insurers_new_create
      summary: Add an insurer
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInsurerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminInsurerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminInsurerWrite'
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInsurer'
          description: ''
  /api/v1/platform/overview:
    get:
      operationId: platform_overview_retrieve
      summary: Platform-wide counts
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1-365. Defaults to 30.
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
          description: ''
  /api/v1/platform/providers:
    get:
      operationId: platform_providers_retrieve
      summary: Every listed doctor
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProviderList'
          description: ''
  /api/v1/platform/settings:
    get:
      operationId: platform_settings_retrieve
      summary: Platform configuration
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
          description: ''
  /api/v1/platform/settings/update:
    patch:
      operationId: platform_settings_update_partial_update
      summary: Change platform configuration
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlatformSettingsWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlatformSettingsWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlatformSettingsWrite'
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
          description: ''
  /api/v1/platform/staff:
    get:
      operationId: platform_staff_retrieve
      description: An access-control list. A dormant account left active is a standing
        door into one facility's patient data.
      summary: Who can read patient records, and where
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaffList'
          description: ''
  /api/v1/platform/triage-monitoring:
    get:
      operationId: platform_triage_monitoring_retrieve
      summary: Triage outcome aggregates - never answers
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1-365. Defaults to 30.
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageMonitoring'
          description: ''
  /api/v1/platform/verification:
    get:
      operationId: platform_verification_retrieve
      summary: Facilities and providers awaiting verification
      tags:
      - platform
      security:
      - patientJWT: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationQueue'
          description: ''
  /api/v1/platform/verification/facilities/{id}:
    post:
      operationId: platform_verification_facilities_create
      summary: Verify a facility, making it visible to patients
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verify'
