          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
    Patient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        language:
          $ref: '#/components/schemas/LanguageEnum'
        insurer:
          type: string
          nullable: true
        home_location:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
      required:
      - home_location
      - id
      - phone
    QueueEntry:
      type: object
      description: Staff-facing view of one entry.
      properties:
        id:
          type: integer
          readOnly: true
        ticket_code:
          type: string
          readOnly: true
        display_name:
          type: string
          description: |-
            Masked too.

            The model's display_name property falls back to the raw phone when a
            patient has no name on file. Masking `phone` while echoing the same
            number in `display_name` would defeat the point, so the fallback is
            masked here as well.
          readOnly: true
        phone:
          type: string
          description: |-
            Masked. A queue board is readable across a reception desk, and a
            full phone number on screen is a needless disclosure.
          readOnly: true
        service:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/QueueEntryStatusEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        called_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        waited_minutes:
          type: integer
          readOnly: true
      required:
      - called_at
      - display_name
      - id
      - joined_at
      - phone
      - position
      - service
      - status
      - ticket_code
      - waited_minutes
    QueueEntryPublic:
      type: object
      description: |-
        Patient-facing view - no other patient's details, ever.

        Phase 2 adds leave_by and travel_minutes here.
      properties:
        id:
          type: integer
          readOnly: true
        facility:
          allOf:
          - $ref: '#/components/schemas/QueueFacility'
          readOnly: true
        service:
          type: string
          readOnly: true
        ticket_code:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/QueueEntryStatusEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        people_ahead:
          type: integer
          readOnly: true
        eta_minutes:
          type: integer
          nullable: true
          readOnly: true
        eta_confidence:
          type: string
          nullable: true
          readOnly: true
        travel_minutes:
          type: integer
          nullable: true
          readOnly: true
        leave_by:
          type: string
          nullable: true
          description: |-
            The sentence the whole product exists for.

            Null when we cannot compute it - the client then hides the line
            entirely rather than showing a time somebody might act on.
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        as_of:
          type: string
          readOnly: true
      required:
      - as_of
      - eta_confidence
      - eta_minutes
      - facility
      - id
      - joined_at
      - leave_by
      - people_ahead
      - position
      - service
      - status
      - ticket_code
      - travel_minutes
    QueueEntryStatusEnum:
      enum:
      - waiting
      - called
      - served
      - left
      - cancelled
      type: string
      description: |-
        * `waiting` - Waiting
        * `called` - Called
        * `served` - Served
        * `left` - Left without being seen
        * `cancelled` - Cancelled
