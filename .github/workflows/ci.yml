name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: medilink
          POSTGRES_USER: medilink
          POSTGRES_PASSWORD: medilink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medilink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      SECRET_KEY: ci-key
      DEBUG: "True"
      DATABASE_URL: postgis://medilink:medilink@localhost:5432/medilink
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # GeoDjango native dependencies.
      - name: Install GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Migrations are partly hand-written; they must match the models.
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=70

      # The committed schema is the contract both frontends generate from.
      # A stale one means a stale TypeScript client.
      - name: API schema is current
        run: |
          python manage.py spectacular --file schema.yaml --fail-on-warn
          git diff --exit-code schema.yaml || {
            echo "::error::backend/schema.yaml is out of date. Run: python manage.py spectacular --file schema.yaml"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-patient, web-provider, web-admin]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci

      # Regenerate from the committed schema; any diff means the client is
      # stale and a backend rename would otherwise fail at a reception desk.
      - name: Generated API client is current
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::${{ matrix.app }}/src/api/schema.d.ts is stale. Run: npm run gen:api"
            exit 1
          }

      - name: Type check
        run: npm run typecheck

      # --if-present rather than a placeholder script: web-admin has no
      # tests yet, and a `test` script that echoes and exits 0 would report
      # green for a suite that does not exist.
      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npx vite build

      # Performance budget from docs/05. The patient app runs on low-end
      # Android over 3G, so its budget is the one that really matters.
      - name: Bundle size budget
        run: |
          BYTES=$(gzip -c dist/assets/index-*.js | wc -c)
          KB=$((BYTES / 1024))
          echo "gzipped JS: ${KB} KB (budget 150 KB)"
          if [ "$KB" -gt 150 ]; then
            echo "::error::Bundle is ${KB} KB gzipped, over the 150 KB budget."
            exit 1
          fi

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Kinyarwanda is the default language, not an afterthought. A missing key
      # silently falls back to Kinyarwanda text inside an English page.
      - name: Translation files must have identical keys
        working-directory: web-patient
        run: |
          node -e "
            const fs = require('fs');
            const load = (l) => JSON.parse(fs.readFileSync('./src/i18n/' + l + '.json', 'utf8'));
            const langs = ['rw', 'en', 'fr'].map((l) => [l, load(l)]);
            const base = new Set(Object.keys(langs[0][1]));
            let failed = false;
            for (const [lang, bundle] of langs) {
              const keys = new Set(Object.keys(bundle));
              const missing = [...base].filter((k) => !keys.has(k));
              const extra = [...keys].filter((k) => !base.has(k));
              if (missing.length || extra.length) {
                console.error(lang, 'missing:', missing, 'extra:', extra);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log('translation keys aligned across rw/en/fr');
          "
